version: '3.8'

services:
  yatraguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yatraguard-app
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - DATABASE_URL=file:/app/server/prisma/dev.db
      - JWT_SECRET=yatraguard-production-secure-jwt-secret-key-2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ALLOWED_ORIGINS=http://localhost:5001,http://localhost:5173
    volumes:
      - yatraguard_data:/app/server/prisma
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  yatraguard_data:
    driver: local

